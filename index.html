<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Control de Tarjetas</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #141e30, #243b55);
    color: white;
    text-align: center;
    padding: 10px;
}

h2 { margin-top: 25px; }

input, button {
    padding: 10px;
    border-radius: 10px;
    border: none;
}

input {
    margin: 5px;
}

#cardName { width: 160px; }
#cutDay { width: 70px; text-align: center; }

button {
    background: #00c6ff;
    cursor: pointer;
}

.card {
    background: rgba(255,255,255,0.1);
    padding: 15px;
    border-radius: 15px;
    margin: 10px auto;
    max-width: 420px;
}

.logo-box {
    width: 100px;
    height: 100px;
    margin: 10px auto;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.weekdays, .days {
    display: grid;
    grid-template-columns: repeat(7,1fr);
}

.day-btn {
    padding: 10px;
    background: #eee;
    color: black;
    margin: 2px;
    border-radius: 6px;
}

.cut-day { background: green !important; color:white; }
.today-blue { background: blue !important; color:white; }
.due-day { background: red !important; color:white; }

.purchase-1 { background:#fff176 !important; }
.purchase-2 { background:#ffb74d !important; }
.purchase-3 { background:#f57c00 !important; color:white;}

.empty { visibility:hidden; }

.total-box {
    background: rgba(0,0,0,0.3);
    padding: 10px;
    margin-top: 10px;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
}

.status-line {
    margin-top: 10px;
    font-weight: bold;
}

.limit-ok { color: #00e676; }
.limit-bad { color: #ff5252; }

#cards { transition: 0.3s; }

/* NUEVO */
.pay-warning { color: orange; }
.pay-danger { color: red; }
.strike { text-decoration: line-through; opacity: 0.7; }

</style>
</head>

<body>

<h1>💳 Control de Tarjetas</h1>

<input id="cardName" placeholder="Agregar tarjeta">
<input id="cutDay" type="number" placeholder="Corte">
<button onclick="addCard()">Agregar</button>

<div style="margin:15px;">
    <button onclick="changeMonth(-1)">⬅️</button>
    <span id="monthLabel" style="margin:0 10px; font-weight:bold;"></span>
    <button onclick="changeMonth(1)">➡️</button>
</div>

<div id="cards"></div>

<script>

const LOGOS = {
    BBVA: "https://play-lh.googleusercontent.com/bMpPVyW79qGh4hFJGXtPzD2ZreE1L8yrqmqPBZq6ARgw5vaW12L3n5H_vYC4deGG3Q=w240-h480-rw",
    HSBC: "https://play-lh.googleusercontent.com/zLczkvm012G_NwAd22NwbcUveEklKpQWRhXhwhX_nMN5o2AKPG4VKxaXCETSJ9HnuKc=w240-h480-rw",
    SANTANDER: "https://play-lh.googleusercontent.com/JlEjMqsRHfbh4zZtMI-b4Np5kSCvh3H7Tiwf4GSUYUPhZ1_LIAwIXomMamKjefYNLp4=w240-h480-rw",
    NU: "https://play-lh.googleusercontent.com/pdVO2B-EmpJk4qxAT499tcGlVN7V17mGEccPVTb-_A18WsQruKjDKCreASB6IfeE1A=w240-h480-rw",
    INVEX: "https://play-lh.googleusercontent.com/cVX7hllPWx94kC0dHnzYXmvoWHRdXT46zTahQRwoVft7olF9Ru9bBdUmrjRLbQEhqGI=w240-h480-rw",
    BANAMEX: "https://play-lh.googleusercontent.com/M-OrtdbJb1UFuyPbwex6-FTowSMfaKcwsE4NYiGTZ0Q6Aef0SqrTOhmVq9JO40rOTJF-=w240-h480-rw"
};

let cards = JSON.parse(localStorage.getItem("cards")) || [];
let currentDate = new Date();

function save(){
    localStorage.setItem("cards",JSON.stringify(cards));
}

function getLogo(name){
    let upper = name.toUpperCase();
    for(let key in LOGOS){
        if(upper.includes(key)){
            return LOGOS[key];
        }
    }
    return "";
}

function addCard(){
    let name=document.getElementById("cardName").value;
    let cutDay=parseInt(document.getElementById("cutDay").value);

    if(!name || !cutDay) return alert("Completa datos");

    cards.push({
        name,
        cutDay,
        logo:getLogo(name),
        history:[],
        purchaseDays:{},
        paid:false
    });

    document.getElementById("cardName").value="";
    document.getElementById("cutDay").value="";

    save();
    render();
}

function changeMonth(offset){
    let cont = document.getElementById("cards");
    cont.style.opacity = 0;

    setTimeout(()=>{
        currentDate.setMonth(currentDate.getMonth() + offset);
        render();
        cont.style.opacity = 1;
    },200);
}

function render(){

    document.getElementById("monthLabel").innerText =
        currentDate.toLocaleDateString("es-ES",{month:"long",year:"numeric"});

    let now=new Date();
    let today=now.getDate();

    let urgent="", pending="", done="";

    cards.forEach((card,i)=>{

        let total = card.history.reduce((s,h)=>s+parseFloat(h.amount),0);

        let daysToCut = card.cutDay - today;
        if(daysToCut < 0) daysToCut += 30;

        // FECHA DE PAGO
        let dueDate = new Date();
        dueDate.setDate(card.cutDay + 20);

        let diffTime = dueDate - now;
        let daysToPay = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if(daysToPay < 0){
            let nextDue = new Date();
            nextDue.setMonth(nextDue.getMonth() + 1);
            nextDue.setDate(card.cutDay + 20);
            daysToPay = Math.ceil((nextDue - now) / (1000 * 60 * 60 * 24));
        }

        // COLORES
        let payClass = "";
        if(daysToPay <= 5 && !card.paid) payClass = "pay-danger";
        else if(daysToPay <= 10 && !card.paid) payClass = "pay-warning";

        // TACHADO
        let payStrike = card.paid ? "strike" : "";
        let cutStrike = total >= 300 ? "strike" : "";

        let alertText = `
        <span class="${cutStrike}">⏳ Corte: ${daysToCut} día(s)</span> | 
        <span class="${payClass} ${payStrike}">💰 Pago: ${daysToPay} día(s)</span>
        `;

        let isUrgent = daysToCut <= 5 && !card.paid;
        let reachedLimit = total >= 300;
        let isDone = reachedLimit && card.paid;

        let html = generateCardHTML(card,i,total,alertText);

        if(isDone) done+=html;
        else if(isUrgent) urgent+=html;
        else pending+=html;

    });

    document.getElementById("cards").innerHTML = `
    <h2>🔴 Urgentes</h2>
    ${urgent || "Sin tarjetas"}

    <h2>🟡 Pendientes</h2>
    ${pending || "Sin tarjetas"}

    <h2>🟢 Completadas</h2>
    ${done || "Sin tarjetas"}
    `;
}

function generateCardHTML(card,i,total,alertText){

    let now=new Date();
    let todayStr=now.toISOString().split("T")[0];

    let year=currentDate.getFullYear();
    let month=currentDate.getMonth();

    let daysInMonth=new Date(year,month+1,0).getDate();
    let firstDay=new Date(year,month,1).getDay();

    let dueDate=new Date(year,month,card.cutDay);
    dueDate.setDate(dueDate.getDate()+20);
    let dueStr=dueDate.toISOString().split("T")[0];

    let grid="";

    for(let e=0;e<firstDay;e++){
        grid+=`<div class="empty"></div>`;
    }

    for(let d=1;d<=daysInMonth;d++){

        let date=new Date(year,month,d);
        let dateStr=date.toISOString().split("T")[0];

        let cls="day-btn";
        let hasPurchase = card.purchaseDays[dateStr];

        if(d===card.cutDay) cls+=" cut-day";
        if(dateStr===todayStr) cls+=" today-blue";
        if(dateStr===dueStr) cls+=" due-day";

        if(hasPurchase){
            let c=card.purchaseDays[dateStr];
            if(c===1) cls+=" purchase-1";
            else if(c===2) cls+=" purchase-2";
            else cls+=" purchase-3";
        }

        grid+=`<div class="${cls}" onclick="addPurchase(${i},'${dateStr}')">${d}</div>`;
    }

    let historyHTML = "";

    card.history.forEach((h,index)=>{
        historyHTML += `
        <div style="display:flex; justify-content:space-between;">
            <span>${h.date} - $${parseFloat(h.amount).toFixed(2)}</span>
            <button onclick="deletePurchase(${i},${index})">❌</button>
        </div>`;
    });

    let limitText = total >= 300
        ? `<span class="limit-ok">✔️ Límite Alcanzado</span>`
        : `<span class="limit-bad">❌ Límite Pendiente</span>`;

    let paidText = card.paid ? "✔️ Tarjeta Pagada" : "💳 Pago Pendiente";

    return `
    <div class="card">

    <div class="status-line">${alertText}</div>

    <div class="logo-box">
        ${card.logo ? `<img src="${card.logo}">` : "💳"}
    </div>

    <h3>${card.name}</h3>

    <p>F. de Corte: Dia ${card.cutDay} | F. de Pago: ${dueDate.toLocaleDateString()}</p>

    <div class="weekdays">
    <div>Do</div><div>Lu</div><div>Ma</div>
    <div>Mi</div><div>Ju</div><div>Vi</div><div>Sa</div>
    </div>

    <div class="days">${grid}</div>

    <div style="text-align:left;">
        <strong>🧾 Compras:</strong>
        ${historyHTML || "Sin movimientos"}
    </div>

    <div class="status-line">
    ${limitText} | ${paidText}
    </div>

    <div class="total-box">
    💰 Total: $${total.toFixed(2)}
    </div>

    <button onclick="payCard(${i})">💰 Pagar</button>
    <button onclick="deleteCard(${i})">🗑️ Eliminar</button>

    </div>
    `;
}

function addPurchase(i,dateStr){
    let amount=parseFloat(prompt("Monto:"));
    if(isNaN(amount)) return;

    let card=cards[i];

    card.history.push({amount,date:dateStr});

    if(!card.purchaseDays[dateStr]){
        card.purchaseDays[dateStr]=0;
    }
    card.purchaseDays[dateStr]++;

    save();
    render();
}

function deletePurchase(cardIndex,purchaseIndex){

    let card=cards[cardIndex];
    let purchase=card.history[purchaseIndex];
    let date=purchase.date;

    if(card.purchaseDays[date]){
        card.purchaseDays[date]--;
        if(card.purchaseDays[date]<=0){
            delete card.purchaseDays[date];
        }
    }

    card.history.splice(purchaseIndex,1);

    save();
    render();
}

function payCard(i){
    cards[i].paid=true;
    save();
    render();
}

function deleteCard(i){
    if(confirm("¿Eliminar tarjeta?")){
        cards.splice(i,1);
        save();
        render();
    }
}

render();

</script>

</body>
</html>
